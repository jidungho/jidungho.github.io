baseURL: "https://jidungho.github.io" 
title: Yidong He
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        # - name: Books
        #   url: books/
        #   weight: 5 
        # - name: Papers
        #   url: papers/
        #   weight: 2
        # - name: Courses
        #   url: courses/
        #   weight: 3
        # - name: Data
        #   url: data/
        #   weight: 4 
        - name: Readings
          url: readings/
          weight: 6
        - name: Tags
          url: tags/
          weight: 7

params:
    description: "Reading notes and thoughts by Yidong He."
    # Number of readings shown on the homepage; the rest live at /readings/.
    homeReadings: 10
    author: Yidong He
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["readings"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Yidong He
          subtitle: "Software Engineer at Nvidia"
          # YH monogram; the theme clips it to a circle and adds the hairline ring.
          # 320px source displayed at 160 so it stays crisp on retina.
          imageUrl: "logo.png"
          imageTitle: "Yidong He"
          imageWidth: 160
          imageHeight: 160
          buttons:
            # - name: Papers
            #   url: papers/
            # - name: Data
            #   url: data/
            # - name: Books
            #   url: books/
            # - name: Courses
            #   url: courses/
            # - name: Tags
            #   url: tags/
            # - name: Archive
            #   url: archive/
            # - name: Readings
            #   url: readings/

    socialIcons:
        # - name: CV
        #   url: cv.pdf
        - name: Email
          url: mailto:yidongh@nvidia.com
        # - name: Zoom
        #   url: https://www.zoom.us/my/igelfeld
        # - name: Location
        #   url: location/
        # - name: Office Hours
        #   url: officehours/
        # - name: Google Scholar
        #   url: https://scholar.google.com/citations?user=cL23w-4AAAAJ
        # - name: GitHub
        #   url: https://github.com/pmichaillat
        # - name: Substack
        #   url: https://pmichaillat.substack.com
        # - name: YouTube
        #   url: https://www.youtube.com/@pmichaillat
        # - name: Twitter
        #   url: https://x.com/pmichaillat
        # - name: Bluesky
        #   url: https://bsky.app/profile/pmichaillat.bsky.social

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Yidong He"
      # YH ligature: the Y's stem doubles as the H's left stem, and the crossbar
      # meets it at the junction. Uses currentColor so it tracks the header text.
      # The boxed version of the same mark is in static/favicon* for browser tabs.
      iconSVG: '<svg viewBox="0 0 21 24" height="18" width="16" fill="none" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 3.2 8.2 11.2 13.8 3.2"/><path d="M8.2 11.2v9.6"/><path d="M18.4 3.2v17.6"/><path d="M8.2 11.2h10.2"/></svg>'

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2